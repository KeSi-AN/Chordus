[project]
name = "chordus-analyzer"
version = "0.1.0"
description = "Chordus audio analyzer: key, BPM, chords, vocal melody range; YouTube extraction"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "librosa>=0.11",
  "numpy>=1.26",
  "scipy>=1.13",
  "soundfile>=0.12",
  "yt-dlp>=2025.1.1",
  "python-dotenv>=1.0",
  # Vocal isolation for the melody range. CPU torch from PyPI by default; see README for CUDA.
  "demucs>=4.1",
  "torch>=2.4",
  "openai-whisper>=20250625",
]

[project.scripts]
chordus-analyzer = "analyzer.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs model downloads or long audio (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.uv]
# Resolve for the platforms this runs on (Windows dev box, Linux hosting). Intel macOS is
# excluded because demucs pins an old torch there.
environments = [
  "sys_platform == 'win32'",
  "sys_platform == 'linux'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

# On Windows use the CUDA build of torch so Demucs and Whisper run on the GPU. CUDA 12.8 works
# with older NVIDIA drivers; torch falls back to the CPU when no GPU is available.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
